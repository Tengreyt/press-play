name: Sync Sites production deployment

on:
  push:
    branches: ['**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sites-production-deployment
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://press-play-ps5-rental.halid-taramov20004.chatgpt.site
    steps:
      - name: Record the revision served by Sites
        shell: bash
        run: |
          set -euo pipefail
          repository="repos/$GITHUB_REPOSITORY"
          marker="$SITE_URL/press-play-deployment.json"
          check_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          revision=$(curl --fail --silent --show-error --retry 2 --max-time 15 \
            --header 'Cache-Control: no-cache' "$marker?check=$check_id" \
            | jq -er '.revision | select(type == "string" and test("^[0-9a-f]{40}$"))')

          latest=$(gh api "$repository/deployments?environment=production&per_page=1" --jq '.[0] // {}')
          deployment_id=$(jq -r --arg sha "$revision" \
            'select(.sha == $sha and .task == "deploy:sites") | .id' <<< "$latest")

          if [[ -n "$deployment_id" ]]; then
            status=$(gh api "$repository/deployments/$deployment_id/statuses?per_page=1" --jq '.[0] // {}')
            if jq -e --arg url "$SITE_URL" '.state == "success" and .environment_url == $url' <<< "$status" > /dev/null; then
              echo "Production already points to $revision."
              exit 0
            fi
            if jq -e '.state == "inactive"' <<< "$status" > /dev/null; then
              deployment_id=''
            fi
          fi

          if [[ -z "$deployment_id" ]]; then
            # Fail without changing production if the published commit has not reached GitHub yet.
            gh api --silent "$repository/git/commits/$revision"
            deployment_id=$(jq -n --arg ref "$revision" '{
              ref: $ref,
              task: "deploy:sites",
              environment: "production",
              production_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "GreytMove published on Sites"
            }' | gh api "$repository/deployments" --input - --jq '.id')
          fi

          gh api --silent "$repository/deployments/$deployment_id/statuses" \
            -f state=success \
            -f environment=production \
            -f environment_url="$SITE_URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='The published site serves this revision.'
